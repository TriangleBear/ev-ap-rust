[package]
name = "attendance-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Ev_Ap - Event Attendance Automation (Rust rewrite of the CustomTkinter app)"
license = "MIT"
repository = "https://github.com/TriangleBear/ev-ap-rust"
readme = "README.md"
keywords = ["attendance", "rfid", "sqlite", "egui"]
categories = ["database"]

[lib]
name = "ev_ap"
path = "src/lib.rs"

[[bin]]
name = "Attendance_App"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
csv = "1.4.0"
rust_xlsxwriter = "0.96.0"
rfd = "0.17.2"
eframe = "0.32"
egui = "0.32"
egui_extras = "0.32"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
